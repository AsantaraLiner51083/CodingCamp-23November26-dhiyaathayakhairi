
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense & Budget Visualizer</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JavaScript -->
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- Main Container -->
    <main class="container">

        <!-- Application Header -->
        <header class="app-header">
            <h1>Expense & Budget Visualizer</h1>
            <p>Track your daily expenses and manage your budget.</p>
        </header>

        <!-- Total Balance -->
        <section class="balance-section">
            <h2>Total Balance</h2>
            <p id="total-balance">Rp0.00</p>
        </section>

        <!-- Budget Warning -->
        <section id="budget-warning" class="budget-warning" hidden>
            <p id="budget-warning-message"></p>
        </section>

        <!-- Add Transaction Form -->
        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input
                        type="text"
                        id="item-name"
                        placeholder="Enter item name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                
                <div class="form-group">
                    <label for="category">Category</label>

                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Fun">Fun</option>
                            <option value="Bills">Bills</option>
                            <option value="Finance">Finance</option>
                            <option value="Health">Health</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                        </select>
                </div>


                <button type="submit" id="add-button">
                    Add Transaction
                </button>

            </form>
        </section>
        
        
        <!-- Dashboard Grid -->
        <div class="dashboard-grid">

            <!-- Transaction History -->
            <section class="transaction-section">

                <h2>Transactions</h2>

                <div class="transaction-controls">
                    <label for="sort-transactions">Sort by:</label>

                    <select id="sort-transactions">
                        <option value="default">Default</option>
                        <option value="ascending">Amount: Low to High</option>
                        <option value="descending">Amount: High to Low</option>
                    </select>
                </div>

                <ul id="transaction-list">
                    <!-- Transactions will appear here -->
                </ul>

                <p id="empty-message">No transactions yet.</p>

            </section>

            <!-- Spending Chart -->
            <section class="chart-section">

                <h2>Expense Distribution</h2>

                <div class="chart-container">
                    <canvas id="expense-chart"></canvas>
                </div>

            </section>

        </div>


        <!-- Budget Settings -->
        <section class="budget-section">

            <h2>Budget Settings</h2>

            <div class="form-group">
                <label for="budget-limit">Monthly Spending Limit</label>

                <input
                    type="number"
                    id="budget-limit"
                    placeholder="Enter budget limit"
                    min="0"
                    step="0.01"
                >
            </div>

            <button type="button" id="save-budget">
                Save Budget
            </button>

        </section>

        <!-- Theme Toggle -->
        <footer class="app-footer">

            <button type="button" id="theme-toggle">
                Toggle Dark / Light Mode
            </button>

            <p>Expense & Budget Visualizer</p>

        </footer>

    </main>

</body>
</html>
